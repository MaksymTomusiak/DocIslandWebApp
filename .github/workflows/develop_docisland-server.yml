# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Deploy DocIsland Backend API to Azure Web App

on:
  # Trigger on pushes to the 'develop' branch (adjust if your main branch is different)
  push:
    branches:
      - develop
  # Allows you to manually trigger the workflow from the GitHub Actions tab
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'docisland-api-site' # <--- IMPORTANT: Ensure this matches your actual backend App Service name
  DOTNET_ROOT_DIR: 'server/docisland_server' # Path to your .NET project
  OUTPUT_DIR: 'publish_api_output' # Directory to stage published API artifacts

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    environment:
      name: 'Production' # Link to your production environment in GitHub (optional but good practice)
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }} # Provides a direct link to the deployed app
    permissions:
      contents: read # Required for actions/checkout to read your repository code
      id-token: write # Required for secure Azure login (OpenID Connect)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Get your repository code

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # <--- IMPORTANT: Ensure this matches your .NET version

      - name: Restore .NET dependencies
        working-directory: ${{ env.DOTNET_ROOT_DIR }} # Run in your .NET project directory
        run: dotnet restore

      - name: Build .NET app
        working-directory: ${{ env.DOTNET_ROOT_DIR }} # Run in your .NET project directory
        run: dotnet build --configuration Release

      - name: Publish .NET app
        working-directory: ${{ env.DOTNET_ROOT_DIR }} # Run in your .NET project directory
        # Publish output directly to the specified OUTPUT_DIR in the GitHub Actions workspace
        run: dotnet publish -c Release -o ${{ github.workspace }}/${{ env.OUTPUT_DIR }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          # IMPORTANT: You need to generate these secrets for your *new backend App Service*.
          # How to get them:
          # 1. Go to your 'docisland-api-site' App Service in the Azure Portal.
          # 2. In the left navigation, go to "Deployment Center".
          # 3. Choose "GitHub Actions" as the source.
          # 4. Follow the steps; Azure will guide you to generate these secrets and add them to your repo automatically.
          #    Alternatively, you can manually create secrets in your GitHub repo settings.
          client-id: ${{ secrets.AZUREAPPSERVICE_BACKEND_CLIENTID }} # Placeholder - replace with your actual generated secret name
          tenant-id: ${{ secrets.AZUREAPPSERVICE_BACKEND_TENANTID }} # Placeholder - replace with your actual generated secret name
          subscription-id: ${{ secrets.AZUREAPPSERVICE_BACKEND_SUBSCRIPTIONID }} # Placeholder - replace with your actual generated secret name

      - name: Deploy to Azure Web App
        id: deploy-to-webapp # ID for referencing outputs (like URL)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }} # Your backend App Service name
          slot-name: 'Production' # Or your staging slot if applicable
          package: ${{ github.workspace }}/${{ env.OUTPUT_DIR }} # Deploy the published API output directory
          
